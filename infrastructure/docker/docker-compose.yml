version: '3.8'

services:
  backend:
    build:
      context: ./apps/backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - ENVIRONMENT=production
      - CORS_ORIGINS=["http://localhost:3000"]
      - DATABASE_URL=sqlite+aiosqlite:///./netra_demo.db
      - REDIS_URL=redis://redis:6379/0
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - backend_data:/app/uploads
      - db_data:/app/netra_demo.db
    depends_on:
      - redis
      - neo4j

  frontend:
    build:
      context: ./apps/frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  neo4j:
    image: neo4j:4.4
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  backend_data:
  db_data:
  neo4j_data:
